name: gestion_personas_servicios

services:

  # ============================================
  # MICROSERVICIO DE AUTENTICACION
  # ============================================

  autenticacion:
    container_name: gestion_personas_auth

    build:
      context: .
      dockerfile: backend/services/autenticacion/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/autenticacion/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/autenticacion/.env:/app/backend/services/autenticacion/.env:ro

    ports:
      - "127.0.0.1:8001:8001"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE CONSULTA
  # ============================================

  consultar_persona:
    container_name: gestion_personas_consulta

    build:
      context: .
      dockerfile: backend/services/consultar_persona/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/consultar_persona/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/consultar_persona/.env:/app/backend/services/consultar_persona/.env:ro

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE CREACION DE PERSONAS
  # ============================================

  crear_persona:
    container_name: gestion_personas_creacion

    build:
      context: .
      dockerfile: backend/services/crear_persona/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/crear_persona/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/crear_persona/.env:/app/backend/services/crear_persona/.env:ro

    ports:
      - "127.0.0.1:8002:8002"

    networks:
      - red_postgres


# ============================================
# RED COMPARTIDA CON POSTGRESQL
# ============================================

networks:
  red_postgres:
    external: true
    name: postgres_default