
name: gestion_personas_servicios

services:

  # ============================================
  # MICROSERVICIO DE AUTENTICACION
  # ============================================

  autenticacion:
    container_name: gestion_personas_auth

    build:
      context: .
      dockerfile: backend/services/autenticacion/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/autenticacion/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/autenticacion/.env:/app/backend/services/autenticacion/.env:ro

    ports:
      - "127.0.0.1:8001:8001"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE CONSULTA
  # ============================================

  consultar_persona:
    container_name: gestion_personas_consulta

    build:
      context: .
      dockerfile: backend/services/consultar_persona/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/consultar_persona/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/consultar_persona/.env:/app/backend/services/consultar_persona/.env:ro

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE CREACION DE PERSONAS
  # ============================================

  crear_persona:
    container_name: gestion_personas_creacion

    build:
      context: .
      dockerfile: backend/services/crear_persona/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/crear_persona/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/crear_persona/.env:/app/backend/services/crear_persona/.env:ro

    ports:
      - "127.0.0.1:8002:8002"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE MODIFICACION DE PERSONAS
  # ============================================

  modificar_persona:
    container_name: gestion_personas_modificacion

    build:
      context: .
      dockerfile: backend/services/modificar_persona/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/modificar_persona/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/modificar_persona/.env:/app/backend/services/modificar_persona/.env:ro

      # Volumen para conservar las fotografias
      - ./uploads:/app/uploads

    ports:
      - "127.0.0.1:8003:8003"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE AUDITORIA
  # ============================================

  auditoria:
    container_name: gestion_personas_auditoria

    build:
      context: .
      dockerfile: backend/services/auditoria/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/auditoria/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/auditoria/.env:/app/backend/services/auditoria/.env:ro

    ports:
      - "127.0.0.1:8004:8004"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE ELIMINACION DE PERSONAS
  # ============================================

  eliminar_persona:
    container_name: gestion_personas_eliminacion

    build:
      context: .
      dockerfile: backend/services/eliminar_persona/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/eliminar_persona/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    volumes:
      - ./backend/services/eliminar_persona/.env:/app/backend/services/eliminar_persona/.env:ro

    ports:
      - "127.0.0.1:8005:8005"

    networks:
      - red_postgres


  # ============================================
  # API GATEWAY
  # ============================================

  gateway:
    container_name: gestion_personas_gateway

    build:
      context: .
      dockerfile: backend/gateway/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/gateway/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

      AUTH_URL: http://autenticacion:8001
      CONSULTAR_URL: http://consultar_persona:8000
      CREAR_URL: http://crear_persona:8002
      MODIFICAR_URL: http://modificar_persona:8003
      ELIMINAR_URL: http://eliminar_persona:8005
      AUDITORIA_URL: http://auditoria:8004

      # Nuevo servicio de consultas inteligentes
      CONSULTAS_IA_URL: http://consultas_inteligentes:8007

    ports:
      - "127.0.0.1:8006:8006"

    networks:
      - red_postgres


  # ============================================
  # MICROSERVICIO DE CONSULTAS INTELIGENTES
  # ============================================

  consultas_inteligentes:
    container_name: gestion_personas_consultas_ia

    build:
      context: .
      dockerfile: backend/services/consultas_inteligentes/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/services/consultas_inteligentes/.env

    environment:
      PGHOST: db
      PGPORT: "5432"

    # Puerto 8007 disponible dentro de la red Docker.
    # No se publica en el host para evitar conflictos
    # con los tuneles SSH utilizados en desarrollo.

    networks:
      - red_postgres


# ============================================
# RED COMPARTIDA CON POSTGRESQL
# ============================================

networks:
  red_postgres:
    external: true
    name: postgres_default
