[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestion-seguridad"
version = "0.1.0"
description = "Validacion compartida de sesiones de Gestion de Datos Personales"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gestion_seguridad*"]
